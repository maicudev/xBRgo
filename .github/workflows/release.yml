name: Build and release executables

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Build Linux executable
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -C cli -trimpath -ldflags="-s -w" -o "../dist/xbrgo-linux-amd64" .
          (cd dist && tar -czf xbrgo-linux-amd64.tar.gz xbrgo-linux-amd64)

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -C cli -trimpath -ldflags="-s -w" -o "../dist/xbrgo-windows-amd64.exe" .
          (cd dist && zip -q xbrgo-windows-amd64.zip xbrgo-windows-amd64.exe)

      - name: Generate checksums
        run: |
          sha256sum dist/xbrgo-linux-amd64.tar.gz dist/xbrgo-windows-amd64.zip > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "xBRgo ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/xbrgo-linux-amd64.tar.gz \
            dist/xbrgo-windows-amd64.zip \
            dist/SHA256SUMS
